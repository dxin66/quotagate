services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: quotagate
      MYSQL_USER: quotagate
      MYSQL_PASSWORD: quotagate_dev
      MYSQL_ROOT_PASSWORD: root_dev
    ports:
      - "127.0.0.1:3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:6380:6379"

volumes:
  mysql_data: